# Deploys the canonical Vite frontend to Vercel production on every push to
# main. Backend deploy lives in deploy.yml (Fly.io).
#
# Required repo secret:
#   VERCEL_TOKEN — Account Settings → Tokens (project-scoped is OK)
# Optional but recommended (workflow resolves them from the token if the
# token can see project ready-for-robots):
#   VERCEL_ORG_ID      team_i9wBQr2ur295OmAB8COX5Q0r
#   VERCEL_PROJECT_ID  prj_VHdUEY8x5jC9O2dnUdYxbDHWeTqn
#
# Do not use `vercel pull` here. CLI 59 fails on project-scoped tokens with
# "Could not retrieve Project Settings" (user 404 + team 403) even when the
# project GET is 200. `vercel deploy --prod` from the repo root works.
# Production Root Directory is `.` (root vercel.json), not readyforrobots-new/.
name: Deploy frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - "readyforrobots-new/**"
      - "vercel.json"
      - ".vercelignore"
      - ".github/workflows/deploy-frontend.yml"
      - "scripts/sanitize_vercel_cli_secret.py"
      - "scripts/vercel_cli_preflight.py"
  workflow_dispatch:

concurrency:
  group: vercel-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Vercel secrets are configured
        id: guard
        run: python3 scripts/sanitize_vercel_cli_secret.py

      - name: Resolve Vercel project (skip vercel pull)
        if: steps.guard.outputs.configured == 'true'
        run: python3 scripts/vercel_cli_preflight.py

      - name: Setup Node.js
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm install -g vercel@latest

      - name: Deploy production from repo root
        if: steps.guard.outputs.configured == 'true'
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID"
