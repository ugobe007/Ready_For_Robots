name: Hermes Fly workflow

# Runs the Hermes qualify tick against production Fly using GitHub ADMIN_KEY
# (same string as Hermes ~/.hermes/.env RFR_ADMIN_KEY). Never prints the secret.
# Always dry-runs tracks 8–10 (buying-window, video ingest, seed-targets).
# --apply persists infer-qualify only — never fake buying-window/video overlays.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "missions/**"
  workflow_dispatch:
    inputs:
      apply:
        description: Persist infer-qualify on public pipeline IDs (triggers cache rebuild)
        type: boolean
        default: false

concurrency:
  group: hermes-fly-smoke
  cancel-in-progress: false

jobs:
  infer-qualify:
    name: Auth smoke + tracks 8-10 dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hermes workflow against Fly
        env:
          RFR_ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RFR_ADMIN_KEY:-}${ADMIN_KEY:-}" ]; then
            echo "GitHub secret ADMIN_KEY is empty. Set it to Hermes RFR_ADMIN_KEY."
            exit 1
          fi
          extra=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.apply }}" = "true" ]; then
            extra+=(--apply)
          fi
          python3 scripts/hermes_auth_smoke.py "${extra[@]}"
