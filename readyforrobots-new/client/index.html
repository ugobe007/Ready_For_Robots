<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>ReadyForRobots — SIGNAL</title>
    <meta
      name="description"
      content="SIGNAL automates robot sales to closure — discover, develop, and close deals from live market signals." />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var path = window.location.pathname;
          var params = new URLSearchParams(window.location.search);
          if (path === "/calendar" && params.has("code") && params.get("connected") !== "google_calendar") {
            params.delete("code");
            params.delete("state");
            var q = params.toString();
            window.history.replaceState({}, "", q ? path + "?" + q : path);
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
