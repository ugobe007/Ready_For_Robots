# Builds the canonical Vite frontend (readyforrobots-new/) and deploys it to
# Vercel production on every push to main. The backend deploy lives in
# deploy.yml (Fly.io); this workflow only ships the frontend.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — a Vercel access token (Account Settings → Tokens)
#   VERCEL_ORG_ID      — the Vercel team/org id for the project
#   VERCEL_PROJECT_ID  — the Vercel project id for readyforrobots-new
# Until all three are set, this workflow skips the CLI deploy. Production
# still needs a Vercel Git build (Pro) or a promoted Preview of this commit.
# A green skip is not a production deploy.
name: Deploy frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - "readyforrobots-new/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  # Never run two production deploys at once; queue instead of cancelling so a
  # roll finishes cleanly.
  group: vercel-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: readyforrobots-new
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Vercel secrets are configured
        id: guard
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel CLI secrets not set (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID). Skipping CLI deploy. Vercel Git must build this commit (Pro) or a Preview must be promoted."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Vercel CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings (production)
        if: steps.guard.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (uses install/build commands from vercel.json)
        if: steps.guard.outputs.configured == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        if: steps.guard.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
