# Runs on every PR and push to main so merges are blocked if the static site fails to build.
# Path: .github/workflows/ci.yml (this file is the whole workflow definition).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nextjs:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nextjs

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
