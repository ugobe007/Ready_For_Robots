name: Force daily jobs report once

# One catch-up: 2026-10-09 Redis claimed today without a proven Resend id.
# Path filter so later commits on this branch do not re-send.
# Delete this workflow after the operator receives the email.

on:
  push:
    branches:
      - cursor/daily-jobs-inbox-5072
    paths:
      - ".github/workflows/force-daily-jobs-report-once.yml"

jobs:
  send:
    name: POST daily-jobs-report-send force
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Force-send top-25 jobs report via Fly (no LLM)
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SCRAPER_CRON_TOKEN: ${{ secrets.SCRAPER_CRON_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://ready-2-robot.fly.dev/api/v1/market-graph/daily-jobs-report-send"
          BODY='{"force": true, "limit": 25}'
          tmp="$(mktemp)"
          extra=()
          if [ -n "${ADMIN_KEY:-}" ]; then
            extra=(-H "X-Admin-Key: ${ADMIN_KEY}")
          elif [ -n "${SCRAPER_CRON_TOKEN:-}" ]; then
            URL="${URL}?token=${SCRAPER_CRON_TOKEN}"
          else
            echo "::error::No ADMIN_KEY or SCRAPER_CRON_TOKEN — cannot force-send"
            exit 1
          fi
          code="$(curl -sS -o "$tmp" -w "%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            "${extra[@]}" \
            -d "$BODY" || true)"
          echo "HTTP $code"
          cat "$tmp"
          echo
          if [ "$code" != "200" ]; then
            echo "::error::force daily-jobs-report-send failed HTTP $code"
            exit 1
          fi
          python3 - "$tmp" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          if data.get("sent") is not True:
              raise SystemExit(f"force send did not deliver: {data}")
          print("delivered", data.get("resend_id"), "count", data.get("count"))
          PY
