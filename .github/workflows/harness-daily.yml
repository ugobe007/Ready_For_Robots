# Daily autonomous harness loop — Observe → Orient → Act → Verify → Notify
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY     — Claude Agent SDK mission runner
#   DATABASE_URL          — Postgres for harness_snapshot intelligence slice
#
# Cache refresh auth (pick one):
#   ADMIN_KEY             — Raw Fly secret (NOT JWT, NOT fly secrets list digest)
#   SCRAPER_CRON_TOKEN    — Same token as scraper cron URLs (?token=)
#   HARNESS_ADMIN_BEARER  — Admin user Supabase access_token (optional)
#
# Optional secrets:
#   FLY_API_TOKEN         — fly deploy from agent missions
#   RESEND_API_KEY        — email via harness_notify.py
#   HARNESS_NOTIFY_EMAIL  — override notify recipient
#
# Manual run: Actions → Harness daily → Run workflow

name: Harness daily

on:
  schedule:
    # 14:00 UTC daily (~7am PT / 10am ET)
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-run even if today's outcome.md exists
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_agent:
        description: Snapshot + cache refresh only (no ANTHROPIC_API_KEY)
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: harness-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harness:
    name: Daily harness loop
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-harness.txt
            harness/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-harness.txt
          pip install -r harness/requirements.txt

      - name: Configure git for autonomous commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Harness preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SCRAPER_CRON_TOKEN: ${{ secrets.SCRAPER_CRON_TOKEN }}
          HARNESS_ADMIN_BEARER: ${{ secrets.HARNESS_ADMIN_BEARER }}
        run: |
          SKIP_AGENT="${{ github.event.inputs.skip_agent }}"
          ARGS=()
          if [ "$SKIP_AGENT" != "true" ]; then
            ARGS+=(--require-agent)
          fi
          python3 scripts/harness_preflight.py "${ARGS[@]}" || {
            if [ "$SKIP_AGENT" = "true" ]; then exit 0; fi
            echo "::error::Harness preflight failed — fix ANTHROPIC_API_KEY or run with skip_agent=true"
            exit 1
          }
          python3 scripts/harness_preflight.py --require-cache-auth || \
            echo "::warning::Remote cache refresh may fail — set ADMIN_KEY or SCRAPER_CRON_TOKEN"
          python3 scripts/harness_preflight.py --require-notify || \
            echo "::warning::Daily email will fail — RESEND_API_KEY secret missing"

      - name: Run harness daily loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HARNESS_DATABASE_URL: ${{ secrets.HARNESS_DATABASE_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SCRAPER_CRON_TOKEN: ${{ secrets.SCRAPER_CRON_TOKEN }}
          HARNESS_ADMIN_BEARER: ${{ secrets.HARNESS_ADMIN_BEARER }}
          API_BASE: https://ready-2-robot.fly.dev
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HARNESS_NOTIFY_EMAIL: ugobe07@gmail.com
          ADMIN_EMAILS: ugobe07@gmail.com
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "${{ github.event.inputs.skip_agent }}" = "true" ]; then
            ARGS+=(--skip-agent)
          fi
          python3 scripts/harness_daily.py "${ARGS[@]}"

      - name: Push autonomous commits
        if: success()
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to push."
            exit 0
          fi
          git push origin HEAD:main
