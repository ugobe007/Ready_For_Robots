<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cal sting — Monday pipeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      height: 108px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }
    .frame { display: none; width: 320px; height: 108px; padding: 10px 14px; flex-direction: column; justify-content: center; }
    .frame.active { display: flex; }
    .eyebrow {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #34d399;
      margin-bottom: 4px;
    }
    h1 { font-size: 17px; font-weight: 800; line-height: 1.15; }
    .muted { font-size: 10px; color: #94a3b8; margin-top: 4px; line-height: 1.3; }
    .card {
      background: #fff;
      color: #111;
      border-radius: 6px;
      padding: 6px 8px;
      margin-top: 5px;
      font-size: 9px;
      line-height: 1.3;
    }
    .hot {
      display: inline-block;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 7px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 999px;
      margin-left: 3px;
      vertical-align: middle;
    }
    .cal {
      margin-top: 4px;
      font-size: 9px;
      color: #6ee7b7;
      line-height: 1.3;
      font-style: italic;
    }
    .send {
      margin-top: 5px;
      background: #059669;
      color: #fff;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      padding: 5px;
      border-radius: 5px;
    }
    .url { font-size: 8px; color: #6ee7b7; margin-top: 4px; text-align: center; font-weight: 600; }
  </style>
</head>
<body>
  <div id="f0" class="frame active">
    <div class="eyebrow">Monday · pipeline</div>
    <h1>Who's in market this week?</h1>
    <p class="muted">Spreadsheets. LinkedIn. Guesswork.</p>
  </div>

  <div id="f1" class="frame">
    <div class="eyebrow">Cal · priority match</div>
    <div class="card">
      <strong>MGM Resorts</strong><span class="hot">HOT</span><br />
      <span style="color:#6b7280">Hospitality · intent 82</span>
    </div>
    <p class="cal">My read: labor pressure + pilot language. Reach out this week.</p>
  </div>

  <div id="f2" class="frame">
    <div class="eyebrow">Outreach ready</div>
    <h1>Draft prepared.</h1>
    <div class="send">Review → send from pipeline</div>
    <p class="url">readyforrobots.com</p>
  </div>

  <script>
    window.showFrame = (n) => {
      document.querySelectorAll(".frame").forEach((el, i) => {
        el.classList.toggle("active", i === n);
      });
    };
  </script>
</body>
</html>
