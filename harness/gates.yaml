# Verification gates — missions must pass before commit/deploy

tests:
  lead_quality_smoke:
    command: python3 -m pytest tests/test_lead_filter_junk.py tests/test_buyer_intent_gate.py -q --tb=no
    required_for:
      - LeadQuality
      - ProductSurface
      - FrictionMiner

  partnership_rule:
    command: python3 -m pytest tests/test_lead_filter_junk.py::test_partnership_compound_names_are_junk -q
    required_for:
      - LeadQuality

  site_health_smoke:
    command: python3 scripts/harness_diagnostics.py --check site
    required_for:
      - PipelineHealth
      - ProductSurface
      - Deploy

  code_conventions:
    command: python3 scripts/harness_diagnostics.py --check code --fail-on-violations
    required_for:
      - ProductSurface
      - Deploy

  harness_diagnostics_unit:
    command: python3 -m pytest tests/test_harness_diagnostics.py -q --tb=no
    required_for:
      - PipelineHealth
      - ProductSurface

  agent_verify:
    command: python3 scripts/agent_verify.py ci
    required_for:
      - ProductSurface
      - Deploy
      - ProductManager

pre_commit:
  block_paths:
    - reports/
    - "*.env"
    - frontend/nextjs/.env.local

deploy:
  autonomous: true
  command: fly deploy -a ready-2-robot --wait-timeout 600
  command_no_migrations: fly deploy -a ready-2-robot --wait-timeout 600 --skip-release-command -y
  post_smoke:
    - curl -sS "${API_BASE}/api/leads/pipeline"
  notify:
    - python3 scripts/harness_notify.py --mission "${MISSION_DIR}"
  never:
    - fly deploy --force
    - git push --force

database:
  never_parallel:
    - local refresh_pipeline_cache
    - fly admin refresh-pipeline-cache
  note: Concurrent cache rebuilds exhaust the DB pool
