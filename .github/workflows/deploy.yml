name: Deploy to Fly.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Default release-command wait (~5m) can be too short if Supabase is cold or migrations hold locks.
      - name: Deploy
        run: flyctl deploy --remote-only --release-command-timeout=15m --wait-timeout=10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
