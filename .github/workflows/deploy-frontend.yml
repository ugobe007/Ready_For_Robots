# Deploys the canonical Vite frontend to Vercel production on every push to
# main. Backend deploy lives in deploy.yml (Fly.io).
#
# Required repo secret:
#   VERCEL_TOKEN — Account Settings → Tokens (project-scoped is OK)
# Optional: VERCEL_ORG_ID / VERCEL_PROJECT_ID (preflight fills them).
#
# Do not use `vercel pull` (CLI 59 + project-scoped token). Do not rely on
# Vercel's cloud Vite build: it returns Ready while transforming and aliases
# a stale index-*.js. Build in GHA, pack Build Output API v3, deploy --prebuilt.
name: Deploy frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - "readyforrobots-new/**"
      - "vercel.json"
      - ".vercelignore"
      - ".github/workflows/deploy-frontend.yml"
      - "scripts/sanitize_vercel_cli_secret.py"
      - "scripts/vercel_cli_preflight.py"
      - "scripts/vercel_pack_static_output.py"
  workflow_dispatch:

concurrency:
  group: vercel-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Vercel secrets are configured
        id: guard
        run: python3 scripts/sanitize_vercel_cli_secret.py

      - name: Resolve Vercel project (skip vercel pull)
        if: steps.guard.outputs.configured == 'true'
        run: python3 scripts/vercel_cli_preflight.py

      - name: Setup Node.js
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install pnpm and Vercel CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm install -g pnpm@10.4.1 vercel@latest

      - name: Install frontend dependencies
        if: steps.guard.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile -C readyforrobots-new

      - name: Vite production build
        if: steps.guard.outputs.configured == 'true'
        run: pnpm --dir readyforrobots-new exec vite build

      - name: Pack Vercel Build Output
        if: steps.guard.outputs.configured == 'true'
        run: python3 scripts/vercel_pack_static_output.py

      - name: Deploy prebuilt output to production
        if: steps.guard.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --project="$VERCEL_PROJECT_ID"

      - name: Confirm production bundle is not the stale hash
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 30 https://readyforrobots.com/)"
          js_path="$(printf '%s' "$html" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
          echo "Live bundle: $js_path"
          if [ "$js_path" = "/assets/index-bxLpnQiT.js" ]; then
            echo "::error::Production still serving stale index-bxLpnQiT.js"
            exit 1
          fi
          bytes="$(curl -fsS --max-time 30 -o /tmp/live.js -w '%{size_download}' "https://readyforrobots.com${js_path}")"
          echo "JS bytes: $bytes"
          test "$bytes" -gt 100000
          grep -q 'Jobs for' /tmp/live.js
          echo "Production JS is a new hashed bundle."
